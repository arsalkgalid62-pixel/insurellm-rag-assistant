# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect GitHub repo

services:
  - type: web
    name: insurellm-rag-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/ingest.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
